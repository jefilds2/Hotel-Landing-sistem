version: "3.9"

services:
  mariadb:
    image: mariadb:11.4
    container_name: hotel-bela-vista-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_hotel_123
      MARIADB_DATABASE: hotel_bela_vista
      MARIADB_USER: hotel_user
      MARIADB_PASSWORD: hotel_pass_123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  db_data:

